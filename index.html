<style>

    background:radial-gradient(ellipse at center, transparent 45%, rgba(0,0,0,.6) 100%); }

  /* boot */
  #boot { position:fixed; inset:0; display:flex; flex-direction:column; }

  .bars2 { flex:0 0 10%; display:flex; } .bars2 div { flex:1; opacity:.85; }

  #ver { position:absolute; left:14px; bottom:10px; font-size:11px; color:rgba(255,255,255,.45); }
  #power { position:absolute; left:50%; bottom:60px; transform:translateX(-50%); background:var(--g); color:#000; border:0; font:inherit; font-weight:bold; font-size:26px; padding:18px 40px; border-radius:6px; }

<script id="content" type="application/json">{"station": "WKST", "channel": "13", "offAir": "October 31, 1987", "kids": {"lead": "Ian", "spotter": "Bryn", "spotterAge": 5}, "boot": {"lines": ["This is WKST. Channel thirteen.", "We went off the air on October thirty-first, nineteen eighty-seven, for reasons that cannot and will not ever be disclosed. You\u2019re safer that way.", "Last night, at three thirteen in the morning, we came back on.", "Nobody is at the station.", "We are broadcasting to one house. If you are the residents of 400 Salem Avenue, SW, in Roanoke, Virginia, and you live in Loft 2K, these messages are for you.", "You have been chosen to solve a series of puzzles. If you succeed, there will be a spectacular prize. If you fail, well... you will not like the consequences.", "You will have 60 minutes to accomplish all of my tasks. The clock has already started.", "Every task you complete will lead you to a new frequency, to ensure that nobody else on earth has access to these clues.", "The first clue is on the paper in front of you."]}, "stages": [{"n": 1, "freq": "881", "title": "The cold key", "card": "CASE FILE", "envelope": "Envelope 1", "lines": ["Eighty-eight point one. Good. You can hear me.", "I put the first key where it is coldest.", "Where the ice cream sleeps.", "You will need something warm to get it out.", "The next frequency is behind the lock."], "cardText": ["I put the first key where it is coldest.", "Where the ice cream sleeps.", "You will need something warm to get it out."], "await": "freq", "hint": "Where does the ice cream live? And what melts ice?"}, {"n": 2, "freq": "903", "title": "The empty page", "card": "CLUE 2", "envelope": "supply pouch", "lines": ["Ninety point three.", "That page is not empty.", "I do not write in ink you can see.", "There is a light on the pen."], "cardText": ["This page looks empty.", "I do not write in ink you can see."], "await": "freq", "hint": "What is on the cap of that pen? Shine it on the page ", "envelope": "inside bag B", "lines": ["Ninety-six point six.", "The operator with the envelope knows a word.", "Prove you know it too. Enter the word."], "cardText": ["The operator with the envelope knows a word.", "Prove you know it too."], "await": "code", "answer": "TREAT", "keys": "letters", "success": ["Correct.", "Now say it to her. Out loud.", "She is listening."], "hint": "What sound does tiger start with? Write that letter first."}, {"n": 8, "freq": "979", "title": "Five keys", "card": "CLUE 8", "envelope": "Envelope 3, from Operator R", "lines": ["Ninety-seven point nine.", "Five keys. Four are mine. One is yours.", "Follow the pattern."], "cardText": ["Five keys. Four are mine. One is yours.", "Follow the pattern."], "await": "freq", "hint": "Say the shapes out loud. Star, circle, triangle, star, circle, triangle, star, circle..."}, {"n": 9, "freq": "985", "title": "The wire room", "card": "CLUE 9", "envelope": "inside the wire-room door", "lines": ["Ninety-eight point five.", "The red wires are live.", "Touch one, and I will know you are here.", "Cross quietly.", "My balloons are waiting at the end. They remember everything."], "cardText": ["The red wires are live. Touch one, and I will know you are here.", "Cross quietly.", "My balloons are waiting at the end. They remember everything."], "await": "freq", "hint": "No hint for this one. Go slowly. Try again if you touch."}, {"n": 10, "freq": "991", "title": "Things I know", "card": "CLUE 10", "envelope": "inside the balloons", "lines": ["Ninety-nine point one.", "I know things about you.", "I know how old Bryn is.", "I know how many legs a dog has.", "I know how many wheels are on a bicycle.", "Prove you know them too. Enter the three numbers."], "cardText": ["I know things about you. Prove you know them too.", "How old is Bryn?", "How many legs does a dog have?", "How many wheels does a bicycle have?"], "await": "code", "answer": "542", "keys": "digits", "success": ["Correct.", "The vault will open now.", "Go and look."], "hint": "How old are you, Bryn? Count the legs on a stuffed animal."}, {"n": 11, "freq": "999", "title": "My face", "card": "CLUE 11", "envelope": "inside the vault", "lines": ["Ninety-nine point nine. The last one.", "You found the vault. It is empty.", "I moved everything before you came.", "I wrote down where. Not in ink you can see.", "Take the light.", "Look at my face. On the wall."], "cardText": ["You found the vault. It is empty.", "I moved everything before you came.", "I wrote down where, but not in ink you can see.", "Take the light. Look at my face. On the wall."], "await": "found", "hint": "Whose face is on the wall? Turn the lights down and shine the light closer."}], "signoff": {"lines": ["You found it.", "You found all eleven.", "Nobody has ever found all eleven.", "This is WKST. Channel thirteen. Signing off.", "Good night, Operators.", "I will be counting the days."]}, "hintsTotal": 3, "minutes": 60}</script>
<script>
const C = JSON.parse(document.getElementById('content').textContent);
const $ = id => document.getElementById(id);
const KEY = 'wkst.state.v1';
let S = { phase:'off', current:0, input:'none', hints:C.hintsTotal, deadline:null };
let entry = '', lines = [], typed = 0, typeTimer = null, speaking = false, muted = false;

/* ---------- audio ---------- */
let ctx = null, humNode = null;
function ac() { if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)(); if (ctx.state === 'suspended') ctx.resume(); return ctx; }
function noiseBuffer(sec, lp) { const a = ac(); const b = a.createBuffer(1, a.sampleRate * sec, a.sampleRate); const d = b.getChannelData(0); let p = 0; for (let i = 0; i < d.length; i++) { const x = Math.random() * 2 - 1; p = lp * p + (1 - lp) * x; d[i] = p; } return b; }
function playStatic(vol = 0.5, sec = 1.6) { if (muted) return; const a = ac(); const s = a.createBufferSource(); s.buffer = noiseBuffer(sec, 0.6); const g = a.createGain(); g.gain.setValueAtTime(0, a.currentTime); g.gain.linearRampToValueAtTime(vol, a.currentTime + 0.05); g.gain.setValueAtTime(vol, a.currentTime + sec - 0.4); g.gain.linearRampToValueAtTime(0, a.currentTime + sec); s.connect(g).connect(a.destination); s.start(); }
function tone(f, dur, vol = 0.3, type = 'sine', t0 = 0) { if (muted) return; const a = ac(); const o = a.createOscillator(); o.type = type; o.frequency.value = f; const g = a.createGain(); const t = a.currentTime + t0; g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + 0.01); g.gain.setValueAtTime(vol, t + dur - 0.08); g.gain.linearRampToValueAtTime(0, t + dur); o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur); }
function playTune() { if (muted) return; const a = ac(); const o = a.createOscillator(); const g = a.createGain(); o.frequency.setValueAtTime(300, a.currentTime); o.frequency.linearRampToValueAtTime(1700, a.currentTime + 0.6); g.gain.value = 0.25; g.gain.linearRampToValueAtTime(0, a.currentTime + 0.7); o.connect(g).connect(a.destination); o.start(); o.stop(a.currentTime + 0.7); playStatic(0.15, 0.7); }
function playUnlock() { tone(660, 0.18, 0.35); tone(990, 0.35, 0.35, 'sine', 0.18); }
function playWrong() { tone(110, 0.4, 0.25, 'square'); }
function playClick() { if (muted) return; const a = ac(); const s = a.createBufferSource(); s.buffer = noiseBuffer(0.05, 0); const g = a.createGain(); g.gain.value = 0.3; s.connect(g).connect(a.destination); s.start(); }
function startHum() { if (muted || humNode) return; const a = ac(); const o1 = a.createOscillator(); o1.frequency.value = 110; const o2 = a.createOscillator(); o2.frequency.value = 165; const n = a.createBufferSource(); n.buffer = noiseBuffer(4, 0.97); n.loop = true; const g = a.createGain(); g.gain.value = 0.035; const g2 = a.createGain(); g2.gain.value = 0.015; const g3 = a.createGain(); g3.gain.value = 0.004; o1.connect(g); o2.connect(g2); n.connect(g3); g.connect(a.destination); g2.connect(a.destination); g3.connect(a.destination); o1.start(); o2.start(); n.start(); humNode = { stop() { o1.stop(); o2.stop(); n.stop(); } }; }
function stopHum() { if (humNode) { try { humNode.stop(); } catch (e) {} humNode = null; } }

/* ---------- speech ---------- */
/* Pre-rendered voice clips (made on the Mac with the app's own effects chain) play first; the
   browser's built-in speech is only the fallback if a clip is missing or fails to load. */
const CLIPS = {}; let clipSrc = null;
async function loadClip(key) {
  if (CLIPS[key] !== undefined) return CLIPS[key];
  try {
    const r = await fetch('audio/' + key + '.m4a', { cache: 'force-cache' });
    if (!r.ok) throw new Error(r.status);
    const buf = await ac().decodeAudioData(await r.arrayBuffer());
    CLIPS[key] = buf; return buf;
  } catch (e) { CLIPS[key] = null; return null; }
}
function preload() { ['boot','s1','s2','s3','ok3','s4','hint0','hint1','hint2','hint3'].forEach(loadClip); }
const synth = window.speechSynthesis;
let voice = null;
function pickVoice() { const vs = synth ? synth.getVoices() : []; voice = vs.find(v => /en[-_]US/i.test(v.lang) && /Samantha|Alex|Daniel|Aaron|Fred/i.test(v.name)) || vs.find(v => /^en/i.test(v.lang)) || vs[0] || null; }
if (synth) { pickVoice(); synth.onvoiceschanged = pickVoice; }
let sayToken = 0;
function phrases(line) { return line.match(/[^,.;:?!]+[,.;:?!]*\s*/g) || [line]; }
async function say(arr, asSignal, then, clipKey) {
  stopSpeaking(); const my = ++sayToken;
  if (muted) { then && then(); return; }
  speaking = true; render();
  if (clipKey) {
    const buf = await loadClip(clipKey);
    if (my !== sayToken) return;
    if (buf) {
      const a = ac(); const src = a.createBufferSource(); src.buffer = buf; src.connect(a.destination);
      src.onended = () => { if (my !== sayToken) return; clipSrc = null; speaking = false; render(); then && then(); };
      clipSrc = src; src.start(); return;
    }
  }
  if (!synth) { speaking = false; render(); then && then(); return; }
  const units = [];
  arr.forEach(line => {
    if (!asSignal) { units.push({ t: line, pitch: 1, rate: 0.95, gap: 200 }); return; }
    let sinceDrop = 0;
    phrases(line).forEach((p, i, all) => {
      sinceDrop++;
      const drop = sinceDrop >= 2 && Math.random() < 0.35;
      if (drop) sinceDrop = 0;
      units.push({ t: p.trim(), pitch: drop ? 0.15 + Math.random() * 0.12 : 0.42 + Math.random() * 0.22, rate: drop ? 0.55 : 0.62, gap: i === all.length - 1 ? 600 : 120 });
    });
  });
  let i = 0;
  const next = () => {
    if (my !== sayToken) return;
    if (i >= units.length) { speaking = false; render(); then && then(); return; }
    const x = units[i++];
    if (!x.t) { next(); return; }
    const u = new SpeechSynthesisUtterance(x.t);
    if (voice) u.voice = voice;
    u.rate = x.rate; u.pitch = x.pitch; u.volume = 1;
    u.onend = () => setTimeout(next, x.gap);
    u.onerror = () => setTimeout(next, 100);
    synth.speak(u);
  };
  next();
}
function stopSpeaking() { sayToken++; if (clipSrc) { try { clipSrc.onended = null; clipSrc.stop(); } catch (e) {} clipSrc = null; } if (synth) synth.cancel(); speaking = false; }

/* ---------- game ---------- */
const stage = () => S.current >= 1 ? C.stages[S.current - 1] : null;
const nextStage = () => S.current < C.stages.length ? C.stages[S.current] : null;
const pretty = f => f.slice(0, 2) + '.' + f.slice(2);
const limit = () => (S.input === 'code' && stage() && stage().answer) ? stage().answer.length : 3;
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
let notice = '';

function transmit(arr, then, clipKey) {
  if (typeTimer) clearInterval(typeTimer);
  lines = arr; typed = 0;
  const total = arr.reduce((n, l) => n + l.length + 1, 0);
  typeTimer = setInterval(() => { typed++; if (typed >= total) clearInterval(typeTimer); render(); }, 45);
  say(arr, true, () => { typed = 1e9; render(); then && then(); }, clipKey);
}
function afterTransmission(s) {
  if (s.await === 'code') { S.input = 'code'; notice = s.keys === 'letters' ? 'ENTER THE WORD' : 'ENTER THE CODE'; }
  else if (s.await === 'found') { S.input = 'found'; notice = 'WHEN YOU HAVE IT, PRESS THE BUTTON'; }
  else { S.input = 'freq'; notice = 'ENTER THE NEXT FREQUENCY'; }
  save(); render();
}
function powerOn() {
  ac(); S.phase = 'booting'; S.deadline = Date.now() + C.minutes * 60000; save();
  playStatic(0.5, 2); startHum(); preload(); render();
  setTimeout(() => { S.phase = 'receiving'; save(); render(); transmit(C.boot.lines, () => { S.input = 'freq'; notice = 'ENTER A FREQUENCY'; save(); render(); }, 'boot'); }, 2200);
}
function press(k) {
  if (!(S.input === 'freq' || S.input === 'code')) return;
  playClick();
  if (k === '⌫') { entry = entry.slice(0, -1); render(); return; }
  if (k === 'GO') { submit(); return; }
  if (entry.length >= limit()) return;
  entry += k; render();
  if (entry.length === limit()) submit();
}
function submit() { const e = entry; entry = ''; if (S.input === 'freq') tune(e); else if (S.input === 'code') check(e); render(); }
function tune(f) {
  const n = nextStage();
  if (n && n.freq === f) {
    S.current = n.n; S.input = 'none'; notice = 'TUNING ' + pretty(f) + '…'; playTune(); save(); render();
    setTimeout(() => { playStatic(0.3, 1.2); transmit(n.lines, () => afterTransmission(n), 's' + n.n); ['s','ok','hint'].forEach(p => loadClip(p + (n.n + 1))); loadClip('ok' + n.n); }, 900);
  } else {
    const old = C.stages.find(s => s.freq === f && s.n <= S.current);
    if (old) { playTune(); S.input = 'none'; notice = 'REPLAYING ' + pretty(f); render(); transmit(old.lines, () => { if (old.n === S.current) afterTransmission(old); else { S.input = 'freq'; notice = 'ENTER A FREQUENCY'; render(); } }, 's' + old.n); }
    else { playWrong(); notice = 'NO SIGNAL ON ' + pretty(f); }
  }
}
function check(code) {
  const s = stage(); if (!s || !s.answer) return;
  if (code.toUpperCase() === s.answer.toUpperCase()) { playUnlock(); S.input = 'none'; notice = 'ACCEPTED'; render(); transmit(s.success || ['Correct.'], () => { S.input = 'freq'; notice = 'ENTER THE NEXT FREQUENCY'; save(); render(); }, 'ok' + s.n); }
  else { playWrong(); notice = 'THAT IS NOT IT'; }
}
function found() { if (S.input !== 'found') return; S.input = 'none'; playUnlock(); S.phase = 'signoff'; save(); render(); transmit(C.signoff.lines, () => { stopHum(); notice = 'OFF AIR'; save(); render(); }, 'signoff'); }
function callMC() {
  if (S.hints <= 0) return; S.hints--; const s = stage();
  const t = s ? s.hint : 'Read the paper in the envelope. The frequency is printed on it.';
  $('hinttext').textContent = t; $('hint').classList.remove('hidden');
  say(['Mission Control here.', t], false, null, 'hint' + (s ? s.n : 0)); save(); render();
}
function replay() { if (S.phase === 'receiving' && S.current === 0) { transmit(C.boot.lines, null, 'boot'); return; } const s = stage(); if (s) transmit(s.lines, null, 's' + s.n); }

/* ---------- GM ---------- */
function gmJump(n) { stopSpeaking(); if (typeTimer) clearInterval(typeTimer); S.current = Math.max(0, n - 1); S.phase = 'receiving'; S.input = 'freq'; entry = ''; lines = ['MISSION CONTROL OVERRIDE', 'WAITING FOR ' + pretty(C.stages[n - 1].freq)]; typed = 1e9; notice = 'ENTER A FREQUENCY'; if (!S.deadline) S.deadline = Date.now() + C.minutes * 60000; startHum(); save(); closeGM(); }
function gmReset() { stopSpeaking(); stopHum(); if (typeTimer) clearInterval(typeTimer); S = { phase:'off', current:0, input:'none', hints:C.hintsTotal, deadline:null }; entry = ''; lines = []; typed = 0; notice = ''; try { localStorage.removeItem(KEY); } catch (e) {} closeGM(); }
function openGM() {
  const s = stage(), n = nextStage();
  let h = '<button class="done" id="gmdone">Done</button><h2>Mission Control</h2><h3>Where the game is</h3>';
  h += '<p>' + (s ? 'Received: ' + s.n + '. ' + s.title + ' (' + pretty(s.freq) + ')' : (S.phase === 'off' ? 'Not started' : 'Boot message; waiting for the first frequency')) + '</p>';
  if (n) h += '<p>Next frequency expected: ' + pretty(n.freq) + ' (clue ' + n.n + ')</p>';
  h += '<p>Hints left: ' + S.hints + ' · Time left: ' + clockText() + '</p><h3>Jump to a clue (the next frequency expected)</h3>';
  C.stages.forEach(st => { h += '<button data-jump="' + st.n + '">' + st.n + '. ' + st.title + ' — ' + pretty(st.freq) + (st.answer ? '  · code ' + st.answer : '') + '</button>'; });
  h += '<h3>Fixes</h3><button id="gmskip">Skip the current code</button><button id="gmadd">Add 10 minutes</button><button id="gmhint">Give back a hint call</button><button id="gmmute">' + (muted ? 'Unmute sound' : 'Mute all sound') + '</button><button id="gmreplay">Replay current transmission</button>';
  h += '<h3>Danger</h3><button class="danger" id="gmreset">Reset the whole game</button>';
  $('gm').innerHTML = h; $('gm').classList.remove('hidden');
  $('gmdone').onclick = closeGM;
  document.querySelectorAll('[data-jump]').forEach(b => b.onclick = () => gmJump(+b.dataset.jump));
  $('gmskip').onclick = () => { const st = stage(); if (S.input === 'code' && st) { check(st.answer); } closeGM(); };
  $('gmadd').onclick = () => { S.deadline = (S.deadline || Date.now()) + 600000; save(); render(); closeGM(); };
  $('gmhint').onclick = () => { S.hints = Math.min(C.hintsTotal, S.hints + 1); save(); render(); closeGM(); };
  $('gmmute').onclick = () => { muted = !muted; if (muted) { stopSpeaking(); stopHum(); } else startHum(); closeGM(); };
  $('gmreplay').onclick = () => { replay(); closeGM(); };
  $('gmreset').onclick = () => { if (confirm('Reset the whole game?')) gmReset(); };
}
function closeGM() { $('gm').classList.add('hidden'); render(); }

/* ---------- render ---------- */
function clockText() { const t = Math.max(0, Math.round(((S.deadline || Date.now()) - Date.now()) / 1000)); return String(Math.floor(t / 60)).padStart(2, '0') + ':' + String(t % 60).padStart(2, '0'); }
function render() {
  const on = S.phase === 'receiving' || S.phase === 'signoff';
  $('boot').classList.toggle('hidden', S.phase !== 'off');
  $('hdr').classList.toggle('hidden', !on); $('main').classList.toggle('hidden', !on);
  if (S.phase === 'booting') { document.body.style.background = '#888'; } else document.body.style.background = '#000';
  if (!on) return;
  $('onair').textContent = S.phase === 'signoff' ? 'OFF AIR' : '● ON AIR'; $('onair').classList.toggle('off', S.phase === 'signoff');
  const s = stage();
  $('meta').textContent = S.phase === 'signoff' ? 'FINAL TRANSMISSION' : (s ? 'FREQ ' + pretty(s.freq) + '  ·  ' + s.n + ' OF ' + C.stages.length : 'INCOMING');
  let left = typed, html = '';
  for (const l of lines) { if (left <= 0) break; if (left >= l.length + 1) { html += '<p>' + esc(l) + '</p>'; left -= l.length + 1; } else { html += '<p>' + esc(l.slice(0, left)) + '</p>'; left = 0; } }
  if (speaking) html += '<p>▮</p>';
  $('lines').innerHTML = html; $('lines').scrollTop = 1e9;
  $('notice').textContent = notice;
  const active = S.input === 'freq' || S.input === 'code';
  $('entry').classList.toggle('idle', !active); $('entrylab').textContent = S.input === 'code' ? 'CODE' : 'FREQ';
  const lim = limit(); let slots = '';
  for (let i = 0; i < lim; i++) { slots += (entry[i] || '_') + (S.input !== 'code' && i === 1 ? '.' : ' '); }
  $('slots').textContent = slots.trim();
  const letters = S.input === 'code' && s && s.keys === 'letters';
  const keys = letters ? ['A','B','E','G','I','N','O','P','R','S','T','⌫'] : ['1','2','3','4','5','6','7','8','9','⌫','0','GO'];
  $('pad').className = (letters ? 'letters' : '') + (active ? '' : ' idle');
  $('pad').innerHTML = keys.map(k => '<button class="' + (k === 'GO' ? 'go' : '') + '" data-k="' + k + '">' + k + '</button>').join('');
  $('pad').style.display = (S.input === 'found' || S.phase === 'signoff') ? 'none' : 'grid';
  $('found').style.display = S.input === 'found' ? 'block' : 'none';
  $('goodnight').style.display = S.phase === 'signoff' ? 'block' : 'none';
  $('call').textContent = S.hints > 0 ? 'CALL MISSION CONTROL (' + S.hints + ')' : 'NO CALLS LEFT'; $('call').disabled = S.hints === 0;
}
function esc(t) { return t.replace(/[&<>]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[c])); }
setInterval(() => { if (S.phase === 'receiving' || S.phase === 'signoff') { const c = $('clock'); c.textContent = clockText(); c.classList.toggle('low', (S.deadline || 0) - Date.now() < 300000); } }, 1000);

/* ---------- wire up ---------- */
$('power').onclick = powerOn;
$('pad').addEventListener('click', e => { const b = e.target.closest('button'); if (b) press(b.dataset.k); });
$('found').onclick = found; $('replay').onclick = () => { ac(); replay(); }; $('call').onclick = () => { ac(); callMC(); };
$('hintok').onclick = () => $('hint').classList.add('hidden');
let holdT = null;
const door = $('gmdoor');
door.addEventListener('touchstart', () => { holdT = setTimeout(openGM, 2000); }, { passive: true });
door.addEventListener('mousedown', () => { holdT = setTimeout(openGM, 2000); });
['touchend', 'touchcancel', 'mouseup', 'mouseleave'].forEach(ev => door.addEventListener(ev, () => clearTimeout(holdT)));

/* restore */
try { const saved = JSON.parse(localStorage.getItem(KEY)); if (saved && saved.phase) { S = Object.assign(S, saved); if (S.phase === 'booting') S.phase = 'receiving';
  if (S.phase === 'receiving') { const s = stage(); if (S.current === 0) { S.input = 'freq'; lines = C.boot.lines; } else if (s) { lines = s.lines; if (S.input === 'none') { S.input = s.await === 'code' ? 'code' : (s.await === 'found' ? 'found' : 'freq'); } } typed = 1e9; notice = S.input === 'code' ? 'ENTER THE CODE' : (S.input === 'found' ? 'WHEN YOU HAVE IT, PRESS THE BUTTON' : 'ENTER A FREQUENCY'); }
  else if (S.phase === 'signoff') { lines = C.signoff.lines; typed = 1e9; notice = 'OFF AIR'; } } } catch (e) {}
render();
</script>
</body>
</html>
